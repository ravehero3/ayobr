name: Deploy AYOBR

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/ubuntu/apps/ayobr
            git fetch origin main
            git reset --hard origin/main
            cd /home/ubuntu/apps
            docker compose up --build -d ayobr
            echo "AYOBR deployed successfully"
